# =============================================================
# GitHub Actions — TastyBytes Medallion Pipeline CI/CD
# Place this file at: .github/workflows/deploy.yml in your repo
#
# SECRETS to add in GitHub → Settings → Secrets → Actions:
#   DATABRICKS_HOST   = https://adb-7405607037153038.18.azuredatabricks.net
#   DATABRICKS_TOKEN  = your Databricks Personal Access Token
#
# ENVIRONMENT to create in GitHub → Settings → Environments:
#   Name: production  (add Required Reviewers here for the approval gate)
# =============================================================

name: CI/CD — TastyBytes Medallion Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:

  # ==============================================================
  # JOB 1 — Validate YAML (runs on every PR and every push)
  # Fast check — confirms bundle is valid before doing anything
  # ==============================================================
  validate:
    name: "Validate Bundle"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

  # ==============================================================
  # JOB 2 — Deploy to DEV + Run pipeline (runs on every PR)
  # This is the CI gate — if the validate notebook fails,
  # the PR is blocked and cannot be merged
  # ==============================================================
  deploy_dev:
    name: "Deploy → Dev"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy to dev
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target dev

      - name: Run pipeline on dev
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run tastybytes_pipeline \
            --target dev \
            --python-named-params "full_load=false"

  # ==============================================================
  # JOB 3 — Deploy to STAGING + Run pipeline (runs on merge to main)
  # Staging must pass before prod approval is requested
  # ==============================================================
  deploy_staging:
    name: "Deploy → Staging"
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy to staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target staging

      - name: Run pipeline on staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run tastybytes_pipeline \
            --target staging \
            --python-named-params "full_load=false"

  # ==============================================================
  # JOB 4 — Deploy to PROD (manual approval required)
  # GitHub pauses here and emails the approvers.
  # Nothing deploys to prod until someone clicks Approve.
  # ==============================================================
  deploy_prod:
    name: "Deploy → Prod (approval required)"
    needs: deploy_staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy to prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target prod

      - name: Confirm deployment
        run: echo "Prod deployment complete. Pipeline runs on its scheduled trigger."